name: Weekly Retail Pipeline Health Check

# Rebuilds the whole pipeline from the real UCI data every Monday and runs the test suite.
# Any failed step (download, load, dbt, clustering or pytest) emails an alert via Gmail.
on:
  schedule:
    - cron: "0 8 * * 1"   # Mondays 08:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: health-check
  cancel-in-progress: false

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RETAIL_DB_PATH: ${{ github.workspace }}/retail_analytics.duckdb
      DBT_PROFILES_DIR: ${{ github.workspace }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Pinned to 3.13 to match local dev: dbt-duckdb has no CPython 3.14 wheels yet.
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare log directory
        run: mkdir -p health_logs

      # The raw UCI CSVs are cached between runs so the weekly job doesn't re-download 45 MB
      # every time. The cache key changes if the fetch script (and so the expected files) changes.
      - name: Restore raw data cache
        uses: actions/cache@v4
        with:
          path: data/raw/*.csv
          key: uci-online-retail-ii-${{ hashFiles('pipelines/fetch_data.py') }}

      - name: Fetch UCI Online Retail II
        id: fetch
        run: |
          set -o pipefail
          python pipelines/fetch_data.py 2>&1 | tee health_logs/fetch.txt

      - name: Load and clean into DuckDB
        id: load
        run: |
          set -o pipefail
          python pipelines/load_to_duckdb.py 2>&1 | tee health_logs/load.txt

      - name: dbt build (models + data tests)
        id: dbt
        run: |
          set -o pipefail
          dbt build 2>&1 | tee health_logs/dbt.txt

      - name: K-Means segmentation
        id: segment
        run: |
          set -o pipefail
          python ml/segmentation.py 2>&1 | tee health_logs/segmentation.txt

      - name: Run pytest suite
        id: pytest
        run: |
          set -o pipefail
          pytest --tb=short -rA --junitxml=health_logs/junit.xml 2>&1 | tee health_logs/pytest.txt

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-logs-${{ github.run_id }}
          path: health_logs/
          retention-days: 30

      - name: Send failure email
        if: failure()
        env:
          ALERT_SENDER_EMAIL: ${{ secrets.ALERT_SENDER_EMAIL }}
          ALERT_RECEIVER_EMAIL: ${{ secrets.ALERT_RECEIVER_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          # Find the first step that failed and send its log.
          for step in fetch:${{ steps.fetch.outcome }} load:${{ steps.load.outcome }} \
                      dbt:${{ steps.dbt.outcome }} segmentation:${{ steps.segment.outcome }} \
                      pytest:${{ steps.pytest.outcome }}; do
            name="${step%%:*}"; outcome="${step##*:}"
            if [ "$outcome" = "failure" ]; then failed="$name"; break; fi
          done
          failed="${failed:-setup}"
          log="health_logs/${failed}.txt"
          python pipelines/notify_failure.py --log-file "$log" --failed-step "$failed" || true
